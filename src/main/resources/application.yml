server:
  port: 8080

spring:
  application:
    name: spring-boot-transaction-service
  datasource:
    url: jdbc:h2:mem:txdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: caffeine

app:
  jwt:
    # Demo-only secret (Base64). Override via APP_JWT_SECRET in real deployments.
    secret: ZGVtby1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLWRlbW8tb25seS0wMTIzNDU2Nzg5YWJjZGVm
    expiration: 3600000

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/txdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:txuser}
    password: ${DB_PASSWORD:txpass}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
